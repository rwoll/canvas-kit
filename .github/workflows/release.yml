# Publish @rwoll/canvas-kit and @rwoll/create-canvas to npm when a version tag
# such as v0.2.0 is pushed. See RELEASING.md.
#
# The publish credential never meets project or dependency code:
# - build does a frozen install, compiles, and packs the tarballs.
# - test runs every check, browser test, and the consumer test.
# - publish runs in the `npm` environment (required reviewer, `v*` tags only)
#   with `id-token: write` for npm trusted publishing. It downloads the build
#   job's artifact by ID, checks each tarball's hash against the build job's
#   output, and runs only `npm publish`, which adds provenance.
# No job restores a dependency cache.
name: Release to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6.1.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @rwoll/canvas-kit build

      - name: Pack
        id: pack
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/publish-npm.mjs pack "$TAG" --out "$RUNNER_TEMP/npm-packages"

      - uses: actions/upload-artifact@v7.0.2
        id: upload
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6.1.0

      - run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm check
          pnpm -r --workspace-concurrency=1 --if-present run playwright:install --with-deps
          pnpm e2e
          pnpm consumer-test --no-e2e

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # The publish script and the commit history only; nothing is installed or built here.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: scripts/publish-npm.mjs
          sparse-checkout-cone-mode: false

      - name: Check the tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main \
            || { echo "::error::$TAG points at $GITHUB_SHA, which is not on main."; exit 1; }

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-packages
          merge-multiple: true

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: node scripts/publish-npm.mjs publish "$TAG" --from "$RUNNER_TEMP/npm-packages"
